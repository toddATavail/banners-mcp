[package]
name = "banners-mcp"
version = "1.0.0"
edition = "2024"
authors = ["Todd L Smith <todd@availlang.org>"]
description = "MCP server that generates perfectly centered 80-column Rust comment banners."
license = "MIT"
repository = "https://github.com/toddATavail/banners-mcp"
keywords = ["mcp", "banner", "rust", "formatting"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "banners-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "0.14", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
rmcp = { version = "0.14", features = ["client", "transport-io"] }
